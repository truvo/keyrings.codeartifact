# House style (github.com/truvo/house-style), consumed as a complete Vale
# package from the @truvo/house-style npm dependency: format bindings and
# rule levels ship inside the package's own config. `vale sync` (run by
# postinstall) refreshes the synced copy under .vale/styles.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = ./node_modules/@truvo/house-style
